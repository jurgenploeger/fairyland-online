# Archives the app, signs it with Apple's cloud signing and uploads it to TestFlight, so builds
# reach testers without a Mac. Runs on every push to main that touches the app, or by hand.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API key ID (Users and Access → Integrations → App Store Connect API)
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list on that page
#   ASC_KEY_P8      the full contents of the downloaded AuthKey_<id>.p8 file
#   APPLE_TEAM_ID   your 10-character team ID (developer.apple.com → Account → Membership details)
# The key needs the Admin role: cloud signing creates the distribution certificate on first use.
name: TestFlight

on:
  push:
    branches: [main]
    paths: ["Fairyland/**", "content/**", "art/**", "sound/**", "project.yml", "Config/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "$(printenv $s)" ] || missing="$missing $s"
          done
          [ -z "$missing" ] || { echo "::error::Missing repository secrets:$missing"; exit 1; }

      - name: Install the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Generate the Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Unique and increasing for every upload; a re-run gets a new attempt number.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          brew install xcodegen
          {
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "CURRENT_PROJECT_VERSION = $BUILD_NUMBER"
          } > Config/Local.xcconfig
          xcodegen generate

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -version
          xcodebuild -project Fairyland.xcodeproj -scheme Fairyland -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Fairyland.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet archive

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Fairyland.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        run: |
          echo "Uploaded build ${{ github.run_number }}.${{ github.run_attempt }} at \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "It shows up in TestFlight after Apple finishes processing (usually 5 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
